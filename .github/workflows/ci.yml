name: RMC CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Linting
      run: npm run lint

    - name: Build Project
      run: npm run build
      env:
        # Skip type checking during build if you want to allow build to pass with TS errors, 
        # but usually for a check you want it to fail. Assuming standard Next.js behavior.
        # If .env is needed, we might need to mock variables or add them to secrets.
        CI: true
